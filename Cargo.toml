[package]
name = "some-roast-bot"
version = "0.3.0"
edition = "2024"
authors = ["Luca Mandrelli <luca.mandrelli@icloud.com>"]

[dependencies]
poise = { version = "0.6.1" }
serenity = { version = "0.12" }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
dotenv = "0.15"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
url = "2.5"
futures-util = "0.3"
rig-core = { version = "0.32", features = ["rmcp"] }
rmcp = { version = "0.16", features = ["client", "macros", "transport-streamable-http-client-reqwest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.35", features = ["bundled"] }
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
config = "0.14"
async-trait = "0.1"
