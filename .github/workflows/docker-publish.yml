name: Build, Push and Deploy

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Extract version tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Pushed version: $VERSION"

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ secrets.TAILSCALE_TAG }}

      - name: Trigger Coolify deploy
        run: |
          WEBHOOK="${{ secrets.COOLIFY_WEBHOOK }}"
          TOKEN="${{ secrets.COOLIFY_TOKEN }}"

          # Append force=true to the webhook URL to request a fresh pull.
          # Note: Coolify has a known bug where force=true restarts the
          # container without re-pulling the image when using :latest.
          # See: https://github.com/coollabsio/coolify/issues/5318
          #
          # Once Coolify fixes this bug, the workflow will automatically
          # start pulling the latest image on every deploy.
          if [[ "$WEBHOOK" == *"?"* ]]; then
            WEBHOOK="${WEBHOOK}&force=true"
          else
            WEBHOOK="${WEBHOOK}?force=true"
          fi

          echo "Triggering Coolify deploy: $WEBHOOK"
          curl -f -s -S --request GET "$WEBHOOK" \
            --header "Authorization: Bearer $TOKEN"
