name: Build, Push and Deploy

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Extract version tag
        id: version
        run: |
          # github.ref_name for tags like v0.2.1 -> strip leading 'v' to get 0.2.1
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Pushed version: $VERSION"

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ secrets.TAILSCALE_TAG }}

      - name: Update Coolify image tag and deploy
        run: |
          # ── Secret configuration ─────────────────────────────────────────
          # COOLIFY_WEBHOOK  → full deploy webhook URL copied from Coolify UI
          # COOLIFY_TOKEN    → API token created in Coolify (Keys & Tokens > API Tokens)
          # COOLIFY_APP_UUID → (optional) application/service UUID; if omitted it is
          #                     extracted automatically from the webhook URL
          # ────────────────────────────────────────────────────────────────

          WEBHOOK="${{ secrets.COOLIFY_WEBHOOK }}"
          TOKEN="${{ secrets.COOLIFY_TOKEN }}"
          VERSION="${{ needs.build.outputs.version }}"

          # Derive base URL from webhook (strip everything from /api/v1/deploy onward)
          BASE_URL=$(echo "$WEBHOOK" | sed -E 's|(/api/v1)?/deploy.*||' | sed 's|/$||')
          echo "Derived Coolify base URL: $BASE_URL"

          # Extract UUID from webhook query param if COOLIFY_APP_UUID is not set
          APP_UUID="${{ secrets.COOLIFY_APP_UUID }}"
          if [ -z "$APP_UUID" ]; then
            APP_UUID=$(echo "$WEBHOOK" | grep -oP 'uuid=\K[^&]+')
            echo "Extracted UUID from webhook: $APP_UUID"
          fi

          echo "Updating image tag to: $VERSION"

          # Try Application endpoint first
          HTTP_CODE=$(curl -s -o /tmp/coolify_patch_response.txt -w "%{http_code}" \
            --request PATCH \
            "$BASE_URL/api/v1/applications/$APP_UUID" \
            --header "Authorization: Bearer $TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"docker_registry_image_tag\": \"$VERSION\"}")

          echo "Application PATCH HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Application PATCH failed (status $HTTP_CODE). Trying Service endpoint..."
            cat /tmp/coolify_patch_response.txt
            echo ""

            HTTP_CODE=$(curl -s -o /tmp/coolify_patch_response.txt -w "%{http_code}" \
              --request PATCH \
              "$BASE_URL/api/v1/services/$APP_UUID" \
              --header "Authorization: Bearer $TOKEN" \
              --header "Content-Type: application/json" \
            --data "{\"docker_registry_image_tag\": \"$VERSION\"}")

            echo "Service PATCH HTTP status: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "Service PATCH also failed (status $HTTP_CODE). Response:"
              cat /tmp/coolify_patch_response.txt
              echo ""
              echo "Falling back to force deploy webhook..."
            else
              echo "Service image tag updated successfully."
            fi
          else
            echo "Application image tag updated successfully."
          fi

          echo "Triggering Coolify deploy via webhook..."
          curl -f -s -S --request GET "$WEBHOOK" \
            --header "Authorization: Bearer $TOKEN" || true
